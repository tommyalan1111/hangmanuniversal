<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="description" content="Hangman Universal - a midnight arcade word game with 21 topics and 7,287 clues.">
<title>Hangman Universal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1122'/%3E%3Cpath d='M18 50V16h26M18 26l12-10M44 16v10' stroke='%23ffc247' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='34' r='6' stroke='%23ffc247' stroke-width='4' fill='none'/%3E%3Cpath d='M44 40v12M44 44l-7 6M44 44l7 6M44 52l-5 8M44 52l5 8' stroke='%23ffc247' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="app" id="app">

  <!-- =============================================================== HOME -->
  <section class="screen is-active" id="screen-home">
    <div class="topbar">
      <div class="brand"><span class="brand-dot">H</span>Universal</div>
      <div class="spacer"></div>
      <span class="pill" title="Your coins"><i class="coin"></i><span id="home-coins">0</span></span>
    </div>

    <div class="home-main">
      <div class="hero">
      <svg class="hero-art" viewBox="0 0 132 132" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe08a"/>
            <stop offset="1" stop-color="#ff9d2e"/>
          </linearGradient>
        </defs>
        <rect x="9" y="7" width="114" height="118" rx="30" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.12)"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="rope-line" stroke-width="4" d="M36 118V22h50"/>
          <path class="rope-line" stroke-width="4" d="M36 40l16-18"/>
          <path class="rope-line" stroke-width="4" d="M86 22v12"/>
          <path class="rope-line" stroke-width="4" d="M20 118h32"/>
          <circle class="figure-line" stroke="url(#hg)" stroke-width="4" cx="86" cy="44" r="9"/>
          <path class="figure-line" stroke="url(#hg)" stroke-width="4" d="M86 53v31"/>
          <path class="figure-line" stroke="url(#hg)" stroke-width="4" d="M86 60l-13 13M86 60l13 13"/>
          <path class="figure-line" stroke="url(#hg)" stroke-width="4" d="M86 84l-9 16M86 84l9 16"/>
        </g>
      </svg>
      <h1 class="wordmark">HANGMAN</h1>
      <p class="wordmark-sub">Universal</p>
      <p class="tagline">Read the clue, fill the blanks. Keep all six lives, build a streak, clear every topic.</p>
    </div>

    <div class="stat-row">
      <div class="stat"><b id="home-level">1</b><span>Level</span></div>
      <div class="stat"><b id="home-streak">0</b><span>Streak</span></div>
      <div class="stat"><b id="home-solved">0</b><span>Solved</span></div>
    </div>

    <nav class="menu">
      <button class="btn btn-primary" id="btn-continue">Play · Level <span id="btn-level">1</span></button>
      <button class="btn btn-ghost" id="btn-categories">Pick a topic</button>
      <!-- Nút Remove Ads đặt ở đây cho dễ thấy -->
      <button class="btn btn-ghost" id="btn-remove-ads" style="display: none;">Remove Ads</button>
      <div class="btn-row">
        <button class="btn btn-ghost" id="btn-daily">Daily</button>
        <button class="btn btn-ghost" id="btn-help">How to play</button>
      </div>
    </nav>
    </div>

    <footer class="home-foot">
      <button class="link-btn" id="btn-sound" aria-pressed="true">Sound: on</button>
      <button class="link-btn" id="btn-reset">Reset</button>
    </footer>
  </section>

  <!-- ========================================================= CATEGORIES -->
  <section class="screen" id="screen-categories">
    <div class="play-head">
      <button class="icon-btn" data-back aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="level-chip"><small>Topics</small><strong id="cats-count">12</strong></div>
      <div class="spacer"></div>
      <span class="pill"><i class="coin"></i><span id="cats-coins">0</span></span>
    </div>
    <div class="section-head">
      <h2>Pick a topic</h2>
      <span id="cats-total"></span>
    </div>
    <div class="cat-list" id="cat-list"></div>
  </section>

  <!-- =============================================================== PLAY -->
  <section class="screen" id="screen-play">
    <div class="play-head">
      <button class="icon-btn" data-back aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="level-chip"><small id="play-mode-label">Level</small><strong id="play-mode-value">1</strong></div>
      <div class="spacer"></div>
      <span class="pill"><i class="coin"></i><span id="play-coins">0</span></span>
    </div>

    <div class="play-meta">
      <span class="cat-chip" id="play-category">Topic</span>
      <div class="lives" id="play-lives" aria-label="Lives left"></div>
    </div>

    <div class="clue-card">
      <svg class="gallows" viewBox="0 0 120 140" aria-hidden="true">
        <g class="frame">
          <path d="M34 126V14h58"/>
          <path d="M34 32l18-18"/>
          <path d="M92 14v14"/>
          <path d="M8 126h52"/>
        </g>
        <g class="part head" data-part="head"><circle cx="92" cy="39" r="11"/></g>
        <g class="part" data-part="body"><path d="M92 50v38"/></g>
        <g class="part" data-part="arm-l"><path d="M92 60L74 74"/></g>
        <g class="part" data-part="arm-r"><path d="M92 60l18 14"/></g>
        <g class="part" data-part="leg-l"><path d="M92 88l-12 20"/></g>
        <g class="part" data-part="leg-r"><path d="M92 88l12 20"/></g>
      </svg>
      <p class="clue-text" id="play-question"></p>
    </div>

    <div class="board">
      <div class="slots" id="play-slots" aria-live="polite"></div>
    </div>

    <div class="keypad" id="keypad"></div>

    <div class="play-actions" style="display: flex; justify-content: space-between; gap: 10px;">
  <!-- Nút 1: Trừ 30 coins -->
  <button class="hint-btn" id="btn-hint-coins" style="flex: 1;">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V15h8v-1.5A6 6 0 0 0 12 3z"/></svg>
    Hint · 30 coins
  </button>

  <!-- Nút 2: Free Hint xem quảng cáo -->
  <button class="hint-btn" id="btn-free-hint" style="flex: 1; background-color: #2b5d44;">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Free Hint 🎁
  </button>
</div>

  </section>

</main>

<div class="overlay" id="overlay" hidden>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/questions.generated.js"></script>
<script src="data/questions.js"></script>
<script src="src/core.js"></script>
<script src="src/services/admob.js"></script>
<script src="src/services/billing.js"></script>
<script src="src/app.js"></script>
</body>
</html>
